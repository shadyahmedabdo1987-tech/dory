name: Deploy Firebase (functions + rules)

# Needs the repo secret FIREBASE_SERVICE_ACCOUNT: the JSON key of a Google Cloud
# service account with the "Firebase Admin" + "Cloud Functions Admin" + "Service Account User" roles
# (or simply "Editor"). The project must be on the Blaze plan for Cloud Functions.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "What to deploy (functions, firestore:rules, storage, or a comma list)"
        default: "functions,firestore:rules"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build functions
        working-directory: functions
        run: npm install --no-audit --no-fund && npm run build
      - name: Credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret first"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy
        run: npx -y firebase-tools@14 deploy --only "${{ inputs.only }}" --project dory-app-eff88 --non-interactive --force
