name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The core has no runtime dependencies, so it runs without npm install.
      - run: npm test

  rules:
    name: Security rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run test:rules

  functions:
    name: Cloud Functions build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

  app:
    name: Typecheck & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
        continue-on-error: true
      - run: npm run typecheck
      - name: Bundle the app (catches import / Metro errors)
        run: npx expo export --platform android --output-dir dist
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ci
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-dory
          EXPO_PUBLIC_FIREBASE_APP_ID: ci
          EXPO_PUBLIC_APP_CHECK: 'off'
