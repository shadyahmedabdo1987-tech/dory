name: Promo video
on: { push: { branches: [promo-video] } }
permissions: { contents: write }
jobs:
  transcribe:
    if: contains(github.event.head_commit.message, '[transcribe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: (pip install faster-whisper && python transcribe.py) > log.txt 2>&1 || true
      - if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tail -c 20000 log.txt > log-tail.txt || true
          gh release delete promo-words -y --cleanup-tag || true
          gh release create promo-words log-tail.txt $(ls words.json 2>/dev/null) --target promo-video --title "words" --notes "words" --prerelease
  render:
    if: contains(github.event.head_commit.message, '[render]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-color-emoji ffmpeg
      - run: node record.mjs
      - run: |
          OFF=$(cat offset.txt)
          ffmpeg -y -ss "$OFF" -i vid/*.webm -c:v libx264 -preset slow -crf 20 -pix_fmt yuv420p -r 30 -an silent.mp4
          ffmpeg -y -i silent.mp4 -i voice.m4a -map 0:v -map 1:a -c:v copy -c:a aac -b:a 160k -shortest -movflags +faststart dory-promo.mp4
          ls -la dory-promo.mp4
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete promo-video -y --cleanup-tag || true
          gh release create promo-video dory-promo.mp4 --target promo-video --title "Promo video" --notes "Dory promo" --prerelease
