name: Promo video
on: { push: { branches: [promo-video] } }
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-color-emoji ffmpeg
      - run: node record.mjs
      - run: |
          OFF=$(cat offset.txt)
          ffmpeg -y -ss "$OFF" -i vid/*.webm -c:v libx264 -preset slow -crf 20 -pix_fmt yuv420p -r 30 -movflags +faststart dory-promo.mp4
          ls -la dory-promo.mp4
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete promo-video -y --cleanup-tag || true
          gh release create promo-video dory-promo.mp4 --target promo-video --title "Promo video" --notes "Dory promo" --prerelease
