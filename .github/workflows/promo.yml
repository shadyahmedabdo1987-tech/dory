name: Promo video
on: { push: { branches: [promo-video] } }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-color-emoji ffmpeg
      - run: node record.mjs
      - run: |
          OFF=$(cat offset.txt)
          ffmpeg -y -ss "$OFF" -i vid/*.webm -c:v libx264 -preset slow -crf 20 -pix_fmt yuv420p -r 30 -movflags +faststart dory-promo.mp4
          ls -la dory-promo.mp4
      - uses: actions/upload-artifact@v4
        with: { name: dory-promo, path: dory-promo.mp4 }
