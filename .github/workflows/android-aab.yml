name: Android App Bundle (Google Play)

on:
  workflow_dispatch:

concurrency:
  group: aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    name: Build Play Store bundle
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production config
        run: cp config/production.env .env

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: 1

      - name: Build release bundle (all CPU types)
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew bundleRelease --no-daemon 2>&1 | tee gradle.log || {
            grep -E "Missing class|ERROR:|error:|What went wrong|FAILURE|R8:" gradle.log | head -30 | while IFS= read -r l; do echo "::error title=gradle::${l}"; done
            exit 1
          }
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.jvmargs=-Xmx4g

      # Signed afterwards with the private upload key (never stored in the repo).
      - name: Publish unsigned bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="dory-${VERSION}-play-unsigned.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$NAME"
          zip -q -d "$NAME" 'META-INF/*' || true
          ls -lh "$NAME"
          TAG="aab-${VERSION}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$NAME" --title "دوري — Google Play bundle $TAG" --notes "Unsigned Play bundle" --prerelease
