appId: com.alabdo.dory
name: Organizer sign-in screen -> forgot password sheet -> close -> back
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "أنا صاحب جمعية"
    timeout: 60000
- tapOn: "أنا صاحب جمعية"
- waitForAnimationToEnd
- takeScreenshot: 09-auth
- runFlow:
    when:
      visible: "نسيت الرقم السري"
    commands:
      - tapOn: "نسيت الرقم السري"
      - waitForAnimationToEnd
      - takeScreenshot: 10-forgot
      - tapOn: "إغلاق"
      - waitForAnimationToEnd
- takeScreenshot: 11-auth-again
- runFlow: lib/back.yaml
- waitForAnimationToEnd
- takeScreenshot: 12-home
- assertVisible: "عندي كود دعوة"
